<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Pokémon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root {
    --screen: #9bbc0f;
    --screen-light: #c4d99f;
    --shade1: #8bac0f;
    --shade2: #306230;
    --shade3: #0f380f;
    --shell: #4a4a52;
    --shell-dark: #2b2b30;
    --accent: #e0405a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #6b6b74, #2b2b30 70%);
    font-family: 'VT323', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--shade3);
  }

  .console {
    width: 100%;
    max-width: 480px;
    background: var(--shell);
    border-radius: 20px 20px 60px 20px;
    padding: 22px 22px 34px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.15);
    border: 2px solid var(--shell-dark);
  }

  .console-brand {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #d8d8e0;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .console-brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    display: inline-block;
    margin-right: 8px;
  }

  .screen-frame {
    background: var(--shade3);
    border-radius: 8px;
    padding: 14px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
  }

  .screen {
    background: var(--screen);
    border-radius: 4px;
    min-height: 420px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }

  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(15,56,15,0.08),
      rgba(15,56,15,0.08) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 5;
  }

  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--shade3);
    margin-bottom: 10px;
  }

  .score {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
  }

  .sprite-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 180px;
  }

  .sprite-stage img {
    width: 160px;
    height: 160px;
    image-rendering: pixelated;
    filter: brightness(0) saturate(100%);
    transition: filter 0.25s ease;
  }

  .sprite-stage img.revealed {
    filter: none;
  }

  .scanline {
    position: absolute;
    left: 8%;
    right: 8%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--shade3), transparent);
    top: 20%;
    opacity: 0;
    box-shadow: 0 0 8px var(--shade3);
  }

  .scanline.active {
    animation: scan 1.1s ease-in-out infinite;
  }

  @keyframes scan {
    0% { top: 15%; opacity: 0.9; }
    50% { top: 85%; opacity: 0.5; }
    100% { top: 15%; opacity: 0.9; }
  }

  .hint-line {
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    min-height: 24px;
    margin-bottom: 6px;
  }

  .message {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    min-height: 34px;
    line-height: 1.6;
    padding: 0 4px;
  }

  .message.good { color: var(--shade2); }
  .message.bad { color: var(--accent); }

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .controls input {
    flex: 1;
    font-family: 'VT323', monospace;
    font-size: 20px;
    background: var(--screen-light);
    border: 2px solid var(--shade3);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--shade3);
    outline: none;
  }

  .controls input:focus {
    background: #fff;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 8px;
    border-radius: 4px;
    border: 2px solid var(--shade3);
    background: var(--shade1);
    color: var(--shade3);
    cursor: pointer;
    flex: 1;
    letter-spacing: 1px;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  button:active { transform: translateY(2px); }
  button:hover { background: #a9c94a; }

  button.secondary {
    background: var(--screen-light);
  }

  button.secondary:hover {
    background: #d7e6ba;
  }

  .dpad-decor {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding: 0 6px;
  }

  .dpad {
    width: 60px;
    height: 60px;
    position: relative;
  }
  .dpad div {
    position: absolute;
    background: #1c1c20;
    border-radius: 2px;
  }
  .dpad .v { width: 18px; height: 60px; left: 21px; }
  .dpad .h { height: 18px; width: 60px; top: 21px; }

  .ab-buttons {
    display: flex;
    gap: 10px;
  }
  .ab-buttons span {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #7a1030;
    display: block;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.4);
  }

  .page-wrap {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .page-topbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .page-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-nav a {
    font-family: 'VT323', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #e8e8ee;
    text-decoration: none;
  }

  .page-nav a:hover {
    color: var(--screen);
  }

  .page-nav .divider {
    color: #6b6b74;
    font-size: 20px;
  }

  @media (prefers-reduced-motion: reduce) {
    .scanline.active { animation: none; opacity: 0.6; }
  }
</style>
</head>
<body>

  <div class="page-wrap">
    <div class="page-topbar">
      <nav class="page-nav">
        <a href="../index.html">HOME</a>
        <span class="divider">|</span>
        <a href="resume.html">RESUME</a>
        <span class="divider">|</span>
        <a href="aboutme.html">ABOUT ME</a>
      </nav>
    </div>

  <div class="console">
    <div class="console-brand"><span><span class="dot"></span>POKéDEX SCANNER</span><span>v1.0</span></div>

    <div class="screen-frame">
      <div class="screen">
        <div class="title-row">
          <span>WHO'S THAT<br>POKéMON?</span>
          <span class="score" id="score">STREAK: 0</span>
        </div>

        <div class="sprite-stage">
          <div class="scanline" id="scanline"></div>
          <img id="sprite" src="" alt="Mystery Pokémon silhouette" />
        </div>

        <div class="hint-line" id="hintLine">&nbsp;</div>
        <div class="message" id="message">Loading a wild Pokémon...</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="guessInput" placeholder="Type a name..." autocomplete="off" disabled>
    </div>
    <div class="btn-row">
      <button id="guessBtn" disabled>GUESS</button>
      <button class="secondary" id="hintBtn" disabled>HINT</button>
      <button class="secondary" id="skipBtn" disabled>SKIP</button>
    </div>

    <div class="dpad-decor">
      <div class="dpad"><div class="v"></div><div class="h"></div></div>
      <div class="ab-buttons"><span></span><span></span></div>
    </div>

  </div>
  </div>

<script>
(function() {
  const spriteEl = document.getElementById('sprite');
  const scanlineEl = document.getElementById('scanline');
  const messageEl = document.getElementById('message');
  const hintLineEl = document.getElementById('hintLine');
  const scoreEl = document.getElementById('score');
  const input = document.getElementById('guessInput');
  const guessBtn = document.getElementById('guessBtn');
  const hintBtn = document.getElementById('hintBtn');
  const skipBtn = document.getElementById('skipBtn');

  const MAX_ID = 898; // through Gen 8
  let currentName = '';
  let revealed = false;
  let hintsUsed = 0;
  let streak = 0;

  function setControlsEnabled(enabled) {
    input.disabled = !enabled;
    guessBtn.disabled = !enabled;
    hintBtn.disabled = !enabled;
    skipBtn.disabled = !enabled;
  }

  function updateScore() {
    scoreEl.textContent = 'STREAK: ' + streak;
  }

  function buildHint() {
    if (!currentName) return '';
    const len = currentName.length;
    const shown = Math.min(hintsUsed, len);
    let out = '';
    for (let i = 0; i < len; i++) {
      if (currentName[i] === '-') {
        out += '- ';
      } else if (i < shown) {
        out += currentName[i].toUpperCase() + ' ';
      } else {
        out += '_ ';
      }
    }
    return out.trim();
  }

  async function loadNewPokemon() {
    revealed = false;
    hintsUsed = 0;
    messageEl.className = 'message';
    messageEl.textContent = 'Loading a wild Pokémon...';
    input.value = '';
    hintLineEl.textContent = '\u00A0';
    skipBtn.textContent = 'SKIP';
    setControlsEnabled(false);
    scanlineEl.classList.add('active');
    spriteEl.classList.remove('revealed');

    try {
      const id = Math.floor(Math.random() * MAX_ID) + 1;
      const res = await fetch('https://pokeapi.co/api/v2/pokemon/' + id);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      currentName = data.name;
      const artUrl =
        (data.sprites.other &&
          data.sprites.other['official-artwork'] &&
          data.sprites.other['official-artwork'].front_default) ||
        data.sprites.front_default;

      const img = new Image();
      img.onload = function() {
        spriteEl.src = artUrl;
        hintLineEl.textContent = buildHint();
        messageEl.textContent = 'A wild silhouette appeared! Type its name.';
        setControlsEnabled(true);
        input.focus();
      };
      img.onerror = function() {
        messageEl.className = 'message bad';
        messageEl.textContent = 'Sprite failed to load. Try SKIP.';
        setControlsEnabled(true);
      };
      img.src = artUrl;
    } catch (err) {
      messageEl.className = 'message bad';
      messageEl.textContent = 'Connection error. Check internet & try SKIP.';
      setControlsEnabled(true);
    }
  }

  function reveal(success) {
    revealed = true;
    spriteEl.classList.add('revealed');
    scanlineEl.classList.remove('active');
    hintLineEl.textContent = currentName.toUpperCase();
    skipBtn.textContent = 'NEXT';
    if (success) {
      streak++;
      messageEl.className = 'message good';
      messageEl.textContent = "Correct! It's " + currentName.toUpperCase() + "!";
    } else {
      streak = 0;
      messageEl.className = 'message bad';
      messageEl.textContent = 'It was ' + currentName.toUpperCase() + '. Streak reset.';
    }
    updateScore();
  }

  function submitGuess() {
    if (revealed) {
      loadNewPokemon();
      return;
    }
    const guess = input.value.trim().toLowerCase();
    if (!guess) return;
    if (guess === currentName.toLowerCase()) {
      reveal(true);
    } else {
      messageEl.className = 'message bad';
      messageEl.textContent = 'Nope, try again!';
      input.value = '';
      input.focus();
    }
  }

  function useHint() {
    if (revealed) return;
    if (hintsUsed < currentName.length) {
      hintsUsed++;
      hintLineEl.textContent = buildHint();
    }
    if (hintsUsed >= currentName.length) {
      messageEl.className = 'message';
      messageEl.textContent = 'That\'s the whole name!';
    }
  }

  guessBtn.addEventListener('click', submitGuess);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitGuess();
  });
  hintBtn.addEventListener('click', useHint);
  skipBtn.addEventListener('click', function() {
    if (revealed) {
      loadNewPokemon();
    } else {
      reveal(false);
    }
  });

  loadNewPokemon();
})();
</script>

</body>
</html>
